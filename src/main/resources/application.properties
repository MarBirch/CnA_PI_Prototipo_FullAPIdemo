spring.application.name=FullAPIdemo
spring.config.import=env.properties

#Ollama
#spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.base-url=${OLLAMA_URL_MARIA}
#spring.ai.ollama.base-url=${OLLAMA_URL_MARIANA}
spring.ai.ollama.chat.model=deepseek-r1:8b

#JDBC
#spring.ai.chat.memory.repository.jdbc.schema = classpath:src/main/java/com/example/FullAPIdemo/mysql_script/message.script
spring.ai.chat.memory.repository.jdbc.initialize-schema=always

#MySql
spring.jpa.hibernate.ddl-auto=update
spring.datasource.url=${DB_DATABASE}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.show-sql=true
spring.data.jpa.repositories.enabled=true
spring.jpa.database=mysql

# Mail Configuration
spring.mail.host=${SPRING_MAIL_HOST:smtp.mailersend.net}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME}
spring.mail.password=${SPRING_MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000